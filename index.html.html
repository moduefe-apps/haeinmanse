<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업실연 스터디 채점표</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1f2328; --sub:#5b6168; --line:#e3e1dc;
  --accent:#c2185b; --accent-soft:#fbe7ef;
  --ok:#1e7a4f; --ok-soft:#e3f3ea; --mid:#a86a00; --mid-soft:#fbf0d9; --no:#b3261e; --no-soft:#fbe4e2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --card:#1f2226; --ink:#eceae6; --sub:#a3a8ae; --line:#33373c;
    --accent:#f06292; --accent-soft:#3a2230;
    --ok:#5cc58f; --ok-soft:#1d3428; --mid:#e0a63c; --mid-soft:#3a2f17; --no:#ef7b73; --no-soft:#3b2120;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
header h1{font-size:22px;margin:0 0 4px}
header p{margin:0;color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > label{flex:1 1 180px;display:flex;flex-direction:column;font-size:12px;color:var(--sub);gap:4px}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:38px}
.tabs{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 .count{font-size:12px;font-weight:500;color:var(--sub)}
.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-of-type{border-top:0}
.itop{display:flex;gap:12px;align-items:center;justify-content:space-between}
.itext{flex:1}
.itext b{font-weight:500}
.hint{font-size:12.5px;color:var(--sub);margin-top:2px}
.marks{display:flex;gap:4px;flex-shrink:0}
.mk{width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--sub);font:inherit;font-weight:700;cursor:pointer}
.mk[data-v="2"].on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.mk[data-v="1"].on{background:var(--mid-soft);border-color:var(--mid);color:var(--mid)}
.mk[data-v="0"].on{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.memo{margin-top:6px;display:none}
.item.open .memo{display:block}
.memobtn{background:none;border:0;color:var(--sub);cursor:pointer;padding:2px 4px;margin-left:4px;vertical-align:-2px;border-radius:6px}.memobtn:hover,.item.open .memobtn{color:var(--accent)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:4px;vertical-align:1px}
.sum{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.big{font-size:30px;font-weight:700}
.bar{flex:1 1 200px;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.miss{margin:10px 0 0;padding-left:18px;font-size:14px}
.miss li{margin:2px 0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font:inherit;font-size:14px;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:500;font-size:12px}
td.c{text-align:center;white-space:nowrap}
.dot{display:inline-block;min-width:22px;text-align:center;border-radius:6px;font-weight:700;font-size:12px;padding:1px 4px}
.d2{background:var(--ok-soft);color:var(--ok)} .d1{background:var(--mid-soft);color:var(--mid)} .d0{background:var(--no-soft);color:var(--no)} .dn{color:var(--sub)}
.warn{color:var(--no);font-weight:500}
.note{font-size:12.5px;color:var(--sub)}
.pick{margin-bottom:12px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer}.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}#cSub .chip{flex:1;border-radius:10px;padding:9px;font-weight:500}.ptitle{font-weight:700;font-size:16px;margin-top:4px}
.legend{font-size:12.5px;color:var(--sub);margin-top:6px}
@media (max-width:520px){ .mk{width:36px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>수업실연 스터디 채점표</h1>
    <p>팔로팔로미 유·초등특수 2차</p>
  </header>

  <div class="card">
    <div class="pick">
      <div class="chips" id="cSub"></div>
      <div class="chips" id="cReg"></div>
      <div class="chips" id="cYear"></div>
      <div class="ptitle" id="ptitle"></div>
    </div>
    <div class="row">
      <label>실연자<input type="text" id="who"></label>
      <label>채점자<input type="text" id="by"></label>
    </div>
    <div class="legend">O 확인 · X 안 함 · ? 모르겠음, 애매함</div>
  </div>

  <div id="sheet"></div>
  <div class="card" id="resultcard">
    <h2>결과</h2>
    <div class="note" id="meta" style="margin:-4px 0 10px"></div>
    <div class="sum">
      <div class="big" id="pct">0%</div>
      <div class="bar"><i id="barfill"></i></div>
      <div class="note" id="done"></div>
    </div>
    <div id="missbox"></div>
    <label style="display:block;margin-top:12px;font-size:12px;color:var(--sub)">총평
      <textarea id="overall"></textarea>
    </label>
  </div>
  <div class="btns">
    <button class="btn" id="share">결과 이미지 공유</button>
    <button class="btn ghost" id="img">이미지로 저장</button>
    <button class="btn ghost" id="reset">새로 채점</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== 문제 데이터 =====

const COMMON_CHO = ["수업 전반", [

  "교사 설명이 1분 넘게 이어지지 않음","도구·기기 사용 전 안전 약속"]];

const Y = (title, cond, trait, extra) => ({title, groups:[["문제 조건",cond],["유아 특성 반영",trait]].concat(extra||[],[COMMON_YU])});
const SEOUL_CHO = "[서울] 수업 전 수업자 의도·개별학습목표 2분 이내";

const LIST = [
 /* ===== 초등특수 기출 · 평가원 ===== */
 {cat:"초등특수 기출", id:"c26p", ...C("2026 평가원 · 수학 '큰 것과 작은 것 직관적으로 비교하기'",
  ["학습 목표 제시부터 활동 2까지 실연","[도입] 개별화 목표 제시","<자료 1> 활동 1, <자료 2> 활동 2","교사-학생 상호작용","학생-학생 상호작용","실생활 연계 + 실생활 적용의 장점 언급","특수교육지원인력 활용","문제행동 예방적 중재","준언어적 표현","오류 지도","활동 전환"],
  ["거송 · 순서를 못 기다리고 친구를 밀치고 나옴","거송 · 친구 돕기 좋아함","나경 · 목소리가 아주 작음(시범 보면 따라 말함)","나경 · 움직임이 작고 소극적","나경 · 손등 접촉에 예민(손등을 물어뜯음)","다솔 · 몸 표현을 두려워해 참여 안 함","다솔 · 일어서고 앉기에 도움 필요, 소근육 어려움"])},
 {cat:"초등특수 기출", id:"c25p", ...C("2025 평가원 · 국어 '급식 시간에 대화하기'",

 {cat:"초등특수 기출", id:"c22p", ...C("2022 평가원 · 수학 '앞과 뒤 알기'",

function blank(pid){
  const n = PROBLEMS[pid].groups.reduce((a,g)=>a+g.items.length,0);
  return {p:pid, who:"", by:"", s:Array(n).fill(-1), m:Array(n).fill(""), o:""};
}
function flatItems(pid){ const out=[]; PROBLEMS[pid].groups.forEach(g=>g.items.forEach(it=>out.push({g:g.name,t:it[0]}))); return out; }

const REG = {p:"평가원",s:"서울",d:"대구",c:"충북",g:"경기",j:"세종",i:"인천"};
LIST.forEach(x=>{
  x.sub = x.id[0]==="c" ? "초등특수" : "유아특수";
  if(x.id[1]==="m"){ x.reg="모의고사"; x.yr=x.id[2]+"회"; }
  else { x.reg=REG[x.id[3]]; x.yr="20"+x.id.slice(1,3); }
  x.short = x.title.replace(/^(모의고사 \d회|\d{4} \S+) · /,"");
});
const REG_ORDER = ["평가원","서울","대구","충북","경기","세종","인천","모의고사"];
function chips(el, vals, on, fn){
  el.innerHTML = vals.map(v=>`<button class="chip ${v===on?'on':''}">${v}</button>`).join("");
  [...el.children].forEach((b,i)=>b.onclick=()=>fn(vals[i]));
}
function drawPick(){
  const P = LIST.find(x=>x.id===cur.p);
  chips($("#cSub"), ["초등특수","유아특수"], P.sub, v=>{ if(v!==P.sub) choose(LIST.find(x=>x.sub===v).id); });
  const regs = REG_ORDER.filter(r=>LIST.some(x=>x.sub===P.sub&&x.reg===r));
  chips($("#cReg"), regs, P.reg, v=>{ if(v!==P.reg) choose(LIST.find(x=>x.sub===P.sub&&x.reg===v).id); });
  const yrs = LIST.filter(x=>x.sub===P.sub&&x.reg===P.reg);
  chips($("#cYear"), yrs.map(x=>x.yr), P.yr, v=>choose(yrs.find(x=>x.yr===v).id));
  $("#ptitle").textContent = P.short;
}
function choose(id){
  if(id===cur.p) return;
  if(cur.s.some(v=>v>=0) && !confirm("다른 문제로 바꾸면 지금 채점이 지워져요. 바꿀까요?")) return;
  const w=cur.who,b=cur.by; cur = blank(id); cur.who=w; cur.by=b; $("#overall").value=""; render(); drawPick();
}

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

const PEN='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

function render(){
  let idx=0, html="";
  PROBLEMS[cur.p].groups.forEach(g=>{
    html += `<div class="card"><h2>${g.name}<span class="count">${g.items.length}항목</span></h2>`;
    g.items.forEach(it=>{
      const i=idx++, v=cur.s[i];
      html += `<div class="item ${cur.m[i]?'open':''}" data-i="${i}">
        <div class="itop"><div class="itext"><b>${it[0]}</b><button class="memobtn" aria-label="메모" title="메모">${PEN}</button></div>
        <div class="marks">${[2,0,1].map(x=>`<button class="mk ${v===x?'on':''}" data-v="${x}">${x===2?'O':x===1?'?':'X'}</button>`).join("")}</div></div>
        <div class="memo"><textarea>${esc(cur.m[i])}</textarea></div></div>`;
    });
    html += `</div>`;
  });
  $("#sheet").innerHTML = html;
  summary();
}
$("#sheet").addEventListener("click", e=>{
  const item = e.target.closest(".item"); if(!item) return;
  const i = +item.dataset.i;
  const mk = e.target.closest(".mk");
  if(mk){
    const v=+mk.dataset.v; cur.s[i] = cur.s[i]===v ? -1 : v;
    item.querySelectorAll(".mk").forEach(b=>b.classList.toggle("on", +b.dataset.v===cur.s[i]));
    save(); summary();
  }
  if(e.target.closest(".memobtn")) item.classList.toggle("open");
});
$("#sheet").addEventListener("input", e=>{
  const item = e.target.closest(".item"); if(!item) return;
  cur.m[+item.dataset.i] = e.target.value; save();
});

function summary(){
  const items = flatItems(cur.p);
  const d=new Date();
  $("#meta").textContent = `${PROBLEMS[cur.p].title} · 실연자 ${cur.who||"-"} · 채점자 ${cur.by||"-"} · ${d.getMonth()+1}월 ${d.getDate()}일`;
  const scored = cur.s.filter(v=>v===2||v===0);
  const pct = scored.length ? Math.round(scored.filter(v=>v===2).length/scored.length*100) : 0;
  $("#pct").textContent = pct+"%";
  $("#barfill").style.width = pct+"%";
  $("#done").textContent = `${cur.s.filter(v=>v>=0).length} / ${items.length} 항목 체크 · 모르겠음 ${cur.s.filter(v=>v===1).length}개`;
  const row = (it,i,cls,ch)=>`<li><span class="dot ${cls}">${ch}</span> ${it.t}${cur.m[i]?`<div class="note">${esc(cur.m[i])}</div>`:""}</li>`;
  const xs = items.map((it,i)=>cur.s[i]===0?row(it,i,"d0","X"):"").join("");
  const qs = items.map((it,i)=>cur.s[i]===1?row(it,i,"d1","?"):"").join("");
  $("#missbox").innerHTML =
    (xs?`<p class="note" style="margin:10px 0 0">놓친 조건</p><ul class="miss">${xs}</ul>`:"")+
    (qs?`<p class="note" style="margin:10px 0 0">더 분명하게 보여 줄 것</p><ul class="miss">${qs}</ul>`:"");
}

/* ===== 이미지 ===== */
async function makeImage(){
  if(!window.html2canvas){ toast("인터넷에 연결한 뒤 다시 눌러 주세요"); return null; }
  const c = await html2canvas($("#resultcard"),{backgroundColor:getComputedStyle(document.body).backgroundColor,scale:2});
  return new Promise(r=>c.toBlob(r,"image/png"));
}
function fname(){ return `채점_${cur.who||"실연자"}_${cur.by||"채점자"}.png`; }
function download(blob){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname(); a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
$("#share").onclick = async ()=>{
  const blob = await makeImage(); if(!blob) return;
  const file = new File([blob], fname(), {type:"image/png"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:"수업실연 채점 결과"}); }
    catch(e){ if(e.name!=="AbortError") { download(blob); toast("공유가 안 돼서 이미지로 저장했어요"); } }
  }else{ download(blob); toast("이 브라우저는 바로 공유가 안 돼서 이미지로 저장했어요"); }
};
$("#img").onclick = async ()=>{ const blob=await makeImage(); if(blob){ download(blob); toast("이미지를 저장했어요"); } };
$("#reset").onclick = ()=>{ if(confirm("지금 채점을 지우고 새로 시작할까요?")){ const b=cur.by; cur=blank(cur.p); cur.by=b; $("#who").value=""; $("#overall").value=""; render(); save(); } };

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2400); }
render();
</script>
